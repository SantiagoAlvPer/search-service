services:
  - type: web
    name: search-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3002
      - key: OPENSEARCH_URL
        sync: false
      - key: OPENSEARCH_INDEX
        value: users
      - key: OPENSEARCH_TLS_REJECT_UNAUTHORIZED
        value: "true"
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_TOPIC_USER_EVENTS
        value: users.events
      - key: KAFKA_GROUP_ID
        value: search-service-group
      - key: KAFKA_SASL_MECHANISM
        value: scram-sha-256
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
